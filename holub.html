<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
  <link rel="icon" href="./images/logoX.png" type="image/x-icon">
  <title>𝐇𝐨𝐥𝐮𝐛</title>

  <style>
    h1, h4 {
      font-family: 'Special Elite';
    }

    body {
      margin: 0;
      padding: 0;
      background: url('image.webp') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    .unsel {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent, rgba(0, 0, 0, 0.7));
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
    }
.highlight {
  display: inline-block;
  background: black;
  color: gray;
  padding: 3px 10px;
  border-radius: 0;
  max-width: calc(100vw - 30px);
  box-sizing: border-box;
}

.date {
  margin-top: 18px;
  font-family: 'Special Elite';
  font-size: 18px;
  color: white;
  text-shadow: 0 0 1px white;
}

/* Mobile */
@media (max-width: 600px) {
  .date {
    font-size: 13px;
    margin-top: 12px;
  }
}
  </style>

  <script>
    window.onload = function() {
      document.getElementById('days').textContent =
        "We shared 1146 beautiful days.";

document.getElementById('months').innerHTML =
  '<span class="highlight">Thank you for every one of them ~ I wouldn\'t erase a single one.</span>';

      document.getElementById('date').textContent =
        "21. července 2023 - 10. září 2026";
    };
  </script>
</head>

<body>
  <div class="overlay">
    <div class="vignette"></div>

    <div class="content">
      <h1 id="days"></h1>
      <h4 id="months"></h4>
      <div id="date" class="date"></div>
    </div>
  </div>
</body>
</html>
